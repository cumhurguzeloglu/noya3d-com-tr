name: CI

on:
  push:
    branches: ['master', 'develop', 'feature/*', 'fix/*', 'hotfix/*']
  pull_request:
    branches: ['master', 'develop']

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Bağımlılıkları yükle
        run: npm ci
      - name: TypeScript denetimi
        run: npx tsc --noEmit

  build:
    name: Production Build
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Bağımlılıkları yükle
        run: npm ci
      - name: Üretim derlemesi
        run: npm run build
