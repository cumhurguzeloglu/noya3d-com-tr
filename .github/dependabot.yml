version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'security']
    groups:
      stripe-packages:
        patterns:
          - 'stripe'
          - '@stripe/*'
      next-packages:
        patterns:
          - 'next'
